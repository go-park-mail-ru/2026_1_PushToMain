syntax = "proto3";

package email;

import "google/protobuf/timestamp.proto";

option go_package = "./proto/email";

service EmailService {
    rpc GetEmailById(GetEmailByIdRequest) returns (GetEmailByIdResponse);
    rpc GetEmailIdsByUserEmailIds(GetEmailIdsByUserEmailIdsRequest) returns (GetEmailIdsByUserEmailIdsResponse);
    rpc CheckEmailAccess(CheckEmailAccessRequest) returns (CheckEmailAccessResponse);
    rpc GetEmailsByIds(GetEmailsByIdsRequest) returns (GetEmailsByIdsResponse);
    rpc SwitchIsInbox(SwitchIsInboxRequest) returns (SwitchIsInboxResponse);
    rpc GetUserEmailID(GetUserEmailIDRequest) returns (GetUserEmailIDResponse);
    rpc SendSystemEmail(SendSystemEmailRequest) returns (SendSystemEmailResponse);
    rpc GetEmailForSupport(GetEmailForSupportRequest) returns (GetEmailForSupportResponse);
}

message SendSystemEmailRequest {
    int64  recipient_user_id = 1;
    string recipient_email   = 2;
    string system_email      = 3;
    string header            = 4;
    string body              = 5;
}

message SendSystemEmailResponse {
    bool success = 1;
}

message GetEmailIdsByUserEmailIdsRequest {
    repeated int64 user_email_ids = 1;
}

message GetEmailIdsByUserEmailIdsResponse {
    repeated int64 email_ids = 1;
}

message GetUserEmailIDRequest {
    int64 email_id = 1;
    int64 user_id = 2;
}

message GetUserEmailIDResponse {
    int64 user_email_id = 1;
}

message SwitchIsInboxRequest {
    int64 user_id = 1;
    int64 email_id = 2;
}

message SwitchIsInboxResponse {
    bool success = 1;
}

message Email {
    int64 id = 1;
    optional int64 sender_id = 2;
    string header = 3;
    string body = 4;
    string created_at = 5;
    // Помечено как анонимное при отправке.
    bool is_anonymous = 6;
}

message GetEmailByIdRequest {
    int64 email_id = 1;
    int64 user_id = 2;
}

message GetEmailByIdResponse {
    Email email = 1;
}

message CheckEmailAccessRequest {
    int64 email_id = 1;
    int64 user_id = 2;
}

message CheckEmailAccessResponse {
    bool has_access = 1;
}

message FolderEmail {
    int64 id = 1;

    string sender_email = 2;
    string sender_name = 3;
    string sender_surname = 4;

    repeated string receiver_list = 5;

    string header = 6;
    string body = 7;

    google.protobuf.Timestamp created_at = 8;

    bool is_read = 9;

    // Если true — frontend показывает "Отправлено анонимно" вместо sender_*.
    // ВНИМАНИЕ: сервер сам решает, очищать ли sender_* для конкретного зрителя
    // (см. service.GetEmailsByIDs / buildEmailsResult).
    bool is_anonymous = 10;
}

message GetEmailsByIdsRequest {
    repeated int64 email_ids = 1;
    int64 user_id = 2;
}

message GetEmailsByIdsResponse {
    repeated FolderEmail emails = 1;
    int32 unread_count = 2;
}

// ── Support API ──────────────────────────────────────────────────────────────

message GetEmailForSupportRequest {
    int64 email_id = 1;
}

message SupportSenderInfo {
    // user_id может быть nil только для внешних писем (LMTP-приём).
    // Для анонимных писем — всегда заполнен.
    optional int64 user_id = 1;
    string email   = 2;
    string name    = 3;
    string surname = 4;
}

message SupportAttachment {
    int64  id           = 1;
    string filename     = 2;
    string content_type = 3;
    int64  size_bytes   = 4;
    google.protobuf.Timestamp created_at = 5;
}

message GetEmailForSupportResponse {
    int64  id                = 1;
    SupportSenderInfo sender = 2;
    repeated string recipients = 3;
    string header            = 4;
    string body              = 5;
    google.protobuf.Timestamp created_at = 6;
    bool   is_anonymous      = 7;
    bool   is_draft          = 8;
    repeated SupportAttachment attachments = 9;
}
