name: CI/CD

on:
  push:
    branches: [main, dev, feat/ci-cd]
  pull_request:
    branches: [main, dev, feat/ci-cd]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: echo "All tests passed" # make test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOSTNAME }} >> ~/.ssh/known_hosts

      - name: Deploy
        # TODO: add production-ready docker images with ghcr
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOSTNAME }} \
          "cd ~/backend && \
          git fetch origin && \
          git reset --hard origin/main && \
          sudo docker compose down && \
          sudo docker compose up -d --build"
