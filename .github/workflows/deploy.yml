name: SMail deployment

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOSTNAME }} >> ~/.ssh/known_hosts

      - name: Deploy
        # TODO: add production-ready docker images with ghcr
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOSTNAME }}
          "cd ~/backend &&
          git fetch origin &&
          git reset --hard origin/main &&
          sudo docker compose down &&
          sudo docker compose up -d --build"
