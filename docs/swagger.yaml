host: localhost:8081
info:
  contact: {}
  title: Smail API
  version: "1.0"
paths:
  /api/v1/auth/logout:
    post:
      description: Завершает сессию пользователя, сбрасывает сессионную куку
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Выход
      tags:
      - auth
  /api/v1/auth/signin:
    post:
      consumes:
      - application/json
      description: Аутентифицирует пользователя и устанавливает сессионную куку
      parameters:
      - description: Данные для входа
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/http.SignInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Вход
      tags:
      - auth
  /api/v1/auth/signup:
    post:
      consumes:
      - application/json
      description: Создаёт нового пользователя и устанавливает сессионную куку
      parameters:
      - description: Данные для регистрации
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/http.SignUpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Регистрация
      tags:
      - auth
  /api/v1/email/emails/{id}/attachments:
    delete:
      consumes:
      - application/json
      parameters:
      - description: Email ID
        in: path
        name: id
        required: true
        type: integer
      - description: Attachment IDs
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.IDsRequest'
      responses:
        "204":
          description: No Content
      summary: Delete attachments
      tags:
      - attachments
    get:
      parameters:
      - description: Email ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.GetAttachmentsResponse'
      summary: List attachments of an email
      tags:
      - attachments
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Email ID
        in: path
        name: id
        required: true
        type: integer
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.AttachmentResponse'
      summary: Upload an attachment to an email
      tags:
      - attachments
  /api/v1/email/emails/{id}/attachments/{attachment_id}:
    get:
      parameters:
      - description: Email ID
        in: path
        name: id
        required: true
        type: integer
      - description: Attachment ID
        in: path
        name: attachment_id
        required: true
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
      summary: Download an attachment
      tags:
      - attachments
  /api/v1/folder/{id}:
    delete:
      description: Удаляет кастомную папку пользователя
      parameters:
      - description: ID папки
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Удалить папку
      tags:
      - folders
    get:
      description: Возвращает список писем в указанной папке с пагинацией
      parameters:
      - description: ID папки
        in: path
        name: id
        required: true
        type: integer
      - description: 'Количество записей на странице (default: 20, max: 100)'
        in: query
        name: limit
        type: integer
      - description: 'Смещение для пагинации (default: 0)'
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.GetEmailsFromFolderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Получить письма из папки
      tags:
      - folders
  /api/v1/folder/{id}/add:
    post:
      consumes:
      - application/json
      description: Добавляет одно или несколько писем в указанную папку
      parameters:
      - description: ID папки
        in: path
        name: id
        required: true
        type: integer
      - description: Список ID писем
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.AddEmailsInFolderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Добавить письма в папку
      tags:
      - folders
  /api/v1/folder/{id}/delete:
    delete:
      consumes:
      - application/json
      description: Удаляет указанные письма из папки
      parameters:
      - description: ID папки
        in: path
        name: id
        required: true
        type: integer
      - description: Список ID писем
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.DeleteEmailsFromFolderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Удалить письма из папки
      tags:
      - folders
  /api/v1/folder/{id}/name:
    put:
      consumes:
      - application/json
      description: Изменяет название существующей кастомной папки
      parameters:
      - description: ID папки
        in: path
        name: id
        required: true
        type: integer
      - description: Новое название папки
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ChangeFolderNameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Изменить название папки
      tags:
      - folders
  /api/v1/folder/new:
    post:
      consumes:
      - application/json
      description: Создаёт новую кастомную папку для писем
      parameters:
      - description: Название папки
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateNewFolderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.CreateNewFolderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Создать новую папку
      tags:
      - folders
  /emails/{id}/reply:
    post:
      consumes:
      - application/json
      - multipart/form-data
      description: |-
        Отправляет ответ на анонимное письмо. Получатель — автор родительского письма.
        Если is_anonymous=true, получатель не увидит email отправителя.
      parameters:
      - description: ID родительского письма
        in: path
        name: id
        required: true
        type: integer
      - description: Тело запроса (JSON)
        in: body
        name: body
        schema:
          $ref: '#/definitions/handler.ReplyRequest'
      - description: Тема письма (multipart)
        in: formData
        name: header
        type: string
      - description: Тело письма (multipart)
        in: formData
        name: body
        type: string
      - description: Отправить анонимно (multipart)
        in: formData
        name: is_anonymous
        type: boolean
      - description: Вложения (multipart)
        in: formData
        name: attachments
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SendEmailResponse'
        "400":
          description: Пустое тело или некорректный запрос
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Нет доступа к родительскому письму
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Родительское письмо не найдено
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Родитель не анонимный или отправитель — автор оригинала
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Ответить на анонимное письмо
      tags:
      - emails
swagger: "2.0"
