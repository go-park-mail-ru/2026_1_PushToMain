        items:
          type: string
        type: array
      sender_email:
        type: string
      sender_name:
        type: string
      sender_surname:
        type: string
    type: object
  handler.AddEmailsInFolderRequest:
    properties:
      emails_id:
        items:
          type: integer
        type: array
    type: object
  handler.AttachmentResponse:
    properties:
      content_type:
        type: string
      created_at:
        type: string
      email_id:
