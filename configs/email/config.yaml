# dev config

port: 8082

jwt:
  secret: super-secret-key
  expire_hours: 24

cors:
  allowed_origins:
    - https://e-smail.ru

  allowed_methods:
    - POST
    - GET
    - OPTIONS
    - PUT
    - DELETE

  allowed_headers:
    - Content-Type
    - Authorization
    - X-CSRF-Token

logger:
  level: debug
  environment: development
  output_path: stdout
  error_output_path: stderr

postgres:
  host: postgres
  port: 5432
  user: ""
  password: ""
  dbname: ""
  sslmode: disable
  migrations_path: "file://db/migrations"
  pool:
    max_open_conns: 10
    max_idle_conns: 5
    conn_max_lifetime_sec: 300
    conn_max_idle_time_sec: 60

drafts:
  max_per_user: 100

grpc:
  email_port: "50052"

grpc_clients:
  user_service: "user-service:50051"
